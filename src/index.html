<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papyr</title>
    <link rel="stylesheet" href="styles.css">
    <script>if(localStorage.getItem('papyr-theme')==='dark')document.documentElement.classList.add('dark-theme')</script>
</head>
<body>
    <aside class="tool-rail" aria-label="Main actions">
        <div class="tool-rail-actions">
            <button
                id="open-file-btn"
                class="tool-rail-btn tool-rail-btn--open"
                type="button"
                aria-label="Open file"
                title="Open File (Ctrl+O)"
            >
                <span class="tool-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path class="icon-fill" d="M3.25 8.25h17.5l-1.42 8.52a2 2 0 0 1-1.97 1.67H6.64a2 2 0 0 1-1.97-1.67L3.25 8.25Z"></path>
                        <path d="M3.25 8.25h5.1l1.9-2.45h4.9a2 2 0 0 1 2 2v.45"></path>
                        <path d="M3.25 8.25h17.5l-1.42 8.52a2 2 0 0 1-1.97 1.67H6.64a2 2 0 0 1-1.97-1.67L3.25 8.25Z"></path>
                    </svg>
                </span>
            </button>
            <button
                id="open-in-word-btn"
                class="tool-rail-btn tool-rail-btn--word"
                type="button"
                aria-label="Open in Microsoft Word"
                title="Open in Microsoft Word"
                disabled
            >
                <span class="tool-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M9.5 4.25h8.25a2 2 0 0 1 2 2v11.5a2 2 0 0 1-2 2H9.5"></path>
                        <path d="M13.25 8h4"></path>
                        <path d="M13.25 11.25h4"></path>
                        <path d="M13.25 14.5h2.75"></path>
                        <rect class="icon-solid" x="3.25" y="6.25" width="9.5" height="11.5" rx="1.75"></rect>
                        <path class="icon-contrast" d="m5.35 9.25 1.2 5.5 1.45-4 1.45 4 1.2-5.5"></path>
                    </svg>
                </span>
            </button>
            <button
                id="toggle-comments-btn"
                class="tool-rail-btn tool-rail-btn--comments"
                type="button"
                aria-label="Toggle comments"
                aria-pressed="false"
                title="Toggle Comments (Ctrl+])"
                disabled
            >
                <span class="tool-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path class="icon-fill" d="M5.25 5.25h10.5a2.5 2.5 0 0 1 2.5 2.5v5.5a2.5 2.5 0 0 1-2.5 2.5H10l-4.75 3.5v-3.5a2.5 2.5 0 0 1-2.5-2.5v-5.5a2.5 2.5 0 0 1 2.5-2.5Z"></path>
                        <path d="M5.25 5.25h10.5a2.5 2.5 0 0 1 2.5 2.5v5.5a2.5 2.5 0 0 1-2.5 2.5H10l-4.75 3.5v-3.5a2.5 2.5 0 0 1-2.5-2.5v-5.5a2.5 2.5 0 0 1 2.5-2.5Z"></path>
                        <path d="M8 9.25h5.75"></path>
                        <path d="M8 12h3.75"></path>
                        <path d="M18.15 8.25h.6a2.5 2.5 0 0 1 2.5 2.5v7.5l-3-2.2"></path>
                    </svg>
                </span>
            </button>
            <button
                id="theme-toggle-btn"
                class="tool-rail-btn tool-rail-btn--theme"
                type="button"
                aria-label="Toggle theme"
                title="Toggle Theme (Ctrl+D)"
            >
                <span class="tool-rail-icon" id="theme-icon" aria-hidden="true"></span>
            </button>
        </div>
    </aside>

    <div class="app-shell">
        <div class="status-banner" id="status-banner" aria-live="polite" aria-atomic="true"></div>

        <div class="app-container">
            <!-- Welcome / empty state -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-content">
                    <h2>Papyr</h2>
                    <p>Lightweight DOCX and XLSX Viewer</p>
                    <button id="welcome-open-btn" class="primary-btn">Open DOCX or Excel File</button>
                    <p class="hint">or drag and drop a .docx, .xlsx, .xlsm, .xlsb, .xls, or .csv file here</p>
                    <div class="recent-files" id="recent-files-section">
                        <h3>Recent files</h3>
                        <div class="recent-files-list" id="recent-files-list">
                            <p class="recent-files-empty">Loading recent files...</p>
                        </div>
                    </div>
                    <p class="file-info" id="file-info"></p>
                </div>
            </div>

            <!-- Document view -->
            <div class="document-view" id="document-view" style="display: none;">
                <div class="desk" id="desk">
                    <div class="desk-content" id="desk-content">
                        <!-- Pages rendered here -->
                    </div>
                </div>
                <aside class="comments-panel" id="comments-panel" style="display: none;">
                    <div class="comments-header">
                        <h3>Comments</h3>
                        <button id="close-comments-btn" class="close-btn">&times;</button>
                    </div>
                    <div class="comments-list" id="comments-list">
                    </div>
                </aside>
            </div>
        </div>

        <!-- Find bar -->
        <div class="find-bar" id="find-bar" style="display: none;">
            <input type="text" id="find-input" placeholder="Find in document..." />
            <span id="find-count"></span>
            <button id="find-prev-btn">&#9650;</button>
            <button id="find-next-btn">&#9660;</button>
            <button id="find-close-btn">&times;</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
