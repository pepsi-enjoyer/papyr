[package]
name = "papyr-app"
version = "0.0.1"
description = "DOCX and XLSX viewer with Tauri"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2" }
tauri-plugin-dialog = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.35"
csv = "1"

# Use the existing DOCX parsing library
papyr = { path = ".." }

# Additional DOCX processing dependencies
zip = "4"
quick-xml = "0.36"
base64 = "0.22"
thiserror = "1.0"

# EMF -> PNG rasterization (Windows GDI), so vector images in DOCX render.
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 1              # Line tables only -- much faster linking
incremental = true

[profile.dev.package."*"]
debug = false          # No debug info for dependencies
