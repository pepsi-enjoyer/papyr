<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3b5b"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ebd2"/>
      <stop offset="1" stop-color="#e6d3ad"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c194"/>
      <stop offset="0.5" stop-color="#f3e4c4"/>
      <stop offset="1" stop-color="#b89a67"/>
    </linearGradient>
    <linearGradient id="fibre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ad7c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9ad7c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9ad7c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Scroll body -->
  <g filter="url(#shadow)">
    <path d="M232 250 H792 V774 H232 Z" fill="url(#paper)"/>
    <!-- vertical papyrus fibres -->
    <rect x="300" y="250" width="70" height="524" fill="url(#fibre)"/>
    <rect x="480" y="250" width="70" height="524" fill="url(#fibre)"/>
    <rect x="655" y="250" width="70" height="524" fill="url(#fibre)"/>
  </g>

  <!-- Top roll -->
  <rect x="196" y="186" width="632" height="112" rx="56" fill="url(#roll)"/>
  <rect x="196" y="186" width="632" height="112" rx="56" fill="none" stroke="#8f7449" stroke-width="6"/>
  <ellipse cx="228" cy="242" rx="30" ry="34" fill="#a68858"/>
  <ellipse cx="228" cy="242" rx="14" ry="16" fill="#7d6238"/>
  <ellipse cx="796" cy="242" rx="30" ry="34" fill="#a68858"/>
  <ellipse cx="796" cy="242" rx="14" ry="16" fill="#7d6238"/>

  <!-- Bottom roll -->
  <rect x="196" y="726" width="632" height="112" rx="56" fill="url(#roll)"/>
  <rect x="196" y="726" width="632" height="112" rx="56" fill="none" stroke="#8f7449" stroke-width="6"/>
  <ellipse cx="228" cy="782" rx="30" ry="34" fill="#a68858"/>
  <ellipse cx="228" cy="782" rx="14" ry="16" fill="#7d6238"/>
  <ellipse cx="796" cy="782" rx="30" ry="34" fill="#a68858"/>
  <ellipse cx="796" cy="782" rx="14" ry="16" fill="#7d6238"/>

  <!-- Text lines -->
  <g fill="#5a4630" opacity="0.85">
    <rect x="300" y="352" width="424" height="28" rx="14"/>
    <rect x="300" y="416" width="350" height="28" rx="14"/>
    <rect x="300" y="480" width="404" height="28" rx="14"/>
  </g>

  <!-- Spreadsheet grid -->
  <g transform="translate(300 560)">
    <rect x="0" y="0" width="424" height="120" rx="14" fill="#2f7d5b"/>
    <g stroke="#f7ebd2" stroke-width="6" opacity="0.9">
      <line x1="0" y1="40" x2="424" y2="40"/>
      <line x1="0" y1="80" x2="424" y2="80"/>
      <line x1="141" y1="0" x2="141" y2="120"/>
      <line x1="283" y1="0" x2="283" y2="120"/>
    </g>
  </g>
</svg>
